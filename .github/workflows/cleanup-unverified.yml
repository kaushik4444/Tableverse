name: Cleanup unverified accounts

# Two jobs, two database roles.
#
#  cleanup-dry-run (daily, and by hand): counts the candidates with CLEANUP_DRYRUN_DATABASE_URL, a SELECT-only role.
#    It has no environment and does not read the deletion secret. The script refuses any role that can write, and the
#    count runs in a READ ONLY transaction, so this job cannot delete anything.
#
#  cleanup-delete: deletes, and only when someone starts the workflow by hand with `execute` set AND the repository
#    variable CLEANUP_EXECUTE is 'true'. It runs in the production-cleanup environment, so a required reviewer must
#    approve it before the job starts; no input can skip that. It never runs on the schedule. It uses CLEANUP_DATABASE_URL.
#
# The script removes only accounts that are unverified, older than 30 days, not guests, and not admins or owners
# (db/unverifiedCleanup.js). It refuses to delete more than --max accounts in one run (default 1000).

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      execute:
        description: 'Request the deletion job (it still waits for approval in the production-cleanup environment)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cleanup-unverified
  cancel-in-progress: false

jobs:
  cleanup-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.CLEANUP_DRYRUN_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the read-only database secret is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::CLEANUP_DRYRUN_DATABASE_URL is not set. Nothing was run."
            exit 1
          fi

      - name: Dry run (SELECT only, counts only)
        run: |
          set -o pipefail
          node scripts/cleanup-unverified.js | tee dry-run.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Unverified account cleanup: dry run"
            echo ''
            echo 'Read-only role (CLEANUP_DRYRUN_DATABASE_URL). The count ran in a READ ONLY transaction, and the script refuses a role that can write.'
            echo ''
            echo '**Records deleted by this run: 0.** This job has no deletion statement and no deletion secret.'
            echo ''
            echo '```'
            cat dry-run.txt 2>/dev/null || echo 'The dry run did not finish. See the job log.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup-delete:
    # Only after the dry run passed, so the reviewer sees its summary before approving.
    needs: cleanup-dry-run
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute == true && vars.CLEANUP_EXECUTE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-cleanup
    env:
      DATABASE_URL: ${{ secrets.CLEANUP_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the deletion secret is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::CLEANUP_DATABASE_URL is not set. Nothing was deleted."
            exit 1
          fi

      - name: Delete candidates (after approval)
        run: |
          set -o pipefail
          node scripts/cleanup-unverified.js --execute | tee execute.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Unverified account cleanup: deletion"
            echo ''
            echo 'Ran in the production-cleanup environment after reviewer approval.'
            echo ''
            echo '```'
            cat execute.txt 2>/dev/null || echo 'The deletion did not finish. See the job log.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
