name: CI

# Every pull request that targets main or development, and every push to main or development.
on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

# Least privilege: the workflow only needs to read the repository. No secrets are used anywhere.
permissions:
  contents: read

# A newer push to the same branch/PR replaces a run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # package.json engines: node >=18. 22 is what the Dockerfile and Render run; 20 is the previous LTS.
        node: [20, 22]

    # A disposable PostgreSQL that exists only for this job. tests/helpers/testdb.js connects to it, creates its own
    # throw-away database (tv_test_<random>) for every test file and drops it afterwards. The user must be allowed to
    # CREATE DATABASE (the image's default superuser is), and the pg tests also use pg_terminate_backend.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password # throw-away container, not a secret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # the steps below only start once this reports healthy
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # Intentionally no npm cache: keep post-job cleanup predictable across the Node matrix.

      - name: Install dependencies
        run: npm ci

      - name: Build (syntax check)
        run: npm run build

      # DATABASE_URL and TEST_DATABASE_URL are deliberately not set here: these tests run on the in-memory store and
      # the PostgreSQL files print SKIPPED. The PostgreSQL tests run in the next step, where they may not skip.
      # The same list as "npm test", one file at a time: each file is named before it starts and stopped after
      # TEST_TIMEOUT_MS, so a stall shows which file it was.
      - name: Unit and server tests (in-memory)
        run: node scripts/run-tests.js

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if PGPASSWORD=ci-only-password pg_isready -h 127.0.0.1 -p 5432 -U postgres; then exit 0; fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1

      # The restore rehearsal dumps the PostgreSQL 17 service with pg_dump and restores it with pg_restore. ubuntu-latest can
      # resolve to an image whose client is 16, which cannot dump a 17 server, so install the matching 17 client tools
      # from the PostgreSQL apt repository and put them first on PATH. The check fails the job if the version is wrong.
      - name: Install PostgreSQL 17 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Check PostgreSQL client version
        run: |
          pg_dump --version
          pg_restore --version
          major=$(pg_dump --version | grep -o '[0-9][0-9]*' | head -1)
          if [ "$major" -lt 17 ]; then echo "pg_dump $major is older than the PostgreSQL 17 service" >&2; exit 1; fi

      # `test:pg` passes --require, so a missing TEST_DATABASE_URL fails the run instead of skipping.
      - name: PostgreSQL integration tests
        run: npm run test:pg
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/postgres

  ui:
    name: Browser layout and interaction checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright for browser checks
        run: npm install --no-save playwright

      # apt's package mirror can fail to resolve on the runner (a transient DNS error); retry the install, then fail the job.
      - name: Install Chromium
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            echo "Chromium install attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          exit 1

      # One deterministic seed covers all games and six phone/tablet/desktop viewports.
      - name: Run browser UI checks
        run: UI_SEED=1 npm run test:ui

  security:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  container:
    name: Build production Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --pull --tag tableverse:ci .
