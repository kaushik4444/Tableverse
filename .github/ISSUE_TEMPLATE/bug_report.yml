name: Bug report (beta)
description: Something is broken or behaves wrongly during the beta.
title: "[Bug] "
labels: ["bug", "beta", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **This issue is public.** Never include a password, your email address, a verification or reset link, or a screenshot that shows them.
        **Safety or security problem** (account compromise, someone's private information, a vulnerability)? Do **not** use this form. Write privately to the support address in the [beta guide](https://github.com/kaushik4444/tableverse/blob/main/docs/SUPPORT_AND_REPORTING.md#how-to-report-a-security-or-privacy-problem).
  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - Not in a game
        - Ludo
        - Snakes and Ladders
        - Property Rivals
        - Wizard
        - Twenty-Nine (29)
        - Poker
        - The Mind
        - Go Fish
        - Tic-Tac-Toe
        - Four in a Row
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - Sign-up, login or email verification
        - Home screen or game list
        - Creating or joining a table
        - During a game
        - Table chat, report or block
        - Profile or settings
        - Something else
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do, step by step?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Copy any message the app showed, exactly.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: How bad is it, in your view?
      description: The owner sets the final priority. This only helps to sort reports quickly.
      options:
        - I cannot play at all, or I lost progress or a result
        - Something important is broken and I found no way around it
        - Annoying, but I can work around it
        - Small or cosmetic
    validations:
      required: true
  - type: checkboxes
    id: critical
    attributes:
      label: Tick any that apply
      description: These are read first.
      options:
        - label: A result, dice roll, card deal or score looked unfair or wrong
        - label: I could see something I should not (another player's hidden cards or tiles, for example)
        - label: I could not log in, sign up or get back into a game I was in
        - label: I lost a game, a result or my progress
  - type: input
    id: device
    attributes:
      label: Device, system and browser
      placeholder: "Example: Pixel 7, Android 15, Chrome 130"
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Connection and country
      options:
        - Wi-Fi, India
        - Mobile data, India
        - Wi-Fi, Germany
        - Mobile data, Germany
        - Other
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: Time it happened, with your time zone
      placeholder: "Example: 14 Nov, around 20:15 CET"
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: Table code (if you were at a table)
      description: The 6-letter code. It helps the owner find the game in the logs.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you send
      options:
        - label: I removed passwords, email addresses, links and screenshots that show them.
          required: true
